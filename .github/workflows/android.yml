
name: Build Winter Arc APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Winter_Arc_90_Android_GitHub_Build_Ready.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir appsrc
          unzip -q Winter_Arc_90_Android_GitHub_Build_Ready.zip -d appsrc
          WRAPPER=$(find appsrc -name gradlew -type f | head -n 1)
          if [ -z "$WRAPPER" ]; then
            echo "Gradle wrapper not found in ZIP"
            exit 1
          fi
          cd "$(dirname "$WRAPPER")"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Winter-Arc-90-APK
          path: appsrc/**/build/outputs/apk/debug/*.apk
